# Render Blueprint for the repository root.
# No paid resources, database, secrets, or external services are provisioned.
services:
  - type: web
    name: smart-campus-navigator
    runtime: python
    plan: free
    rootDir: smart_campus_navigator
    buildCommand: python -m pip install -r requirements-tested.txt
    startCommand: python -m streamlit run app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true
    healthCheckPath: /_stcore/health
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
